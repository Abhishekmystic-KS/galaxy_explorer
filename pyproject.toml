[project]
name = "galaxy-intelligence-platform"
version = "0.1.0"
description = "A web-based Galaxy Intelligence Platform"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "astropy>=5.3.0",
    "astroquery>=0.4.6",
    "matplotlib>=3.7.0",
    "jinja2>=3.1.2",
    "requests>=2.31.0",
    "python-multipart>=0.0.6",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-mock>=3.11.1",
    "pytest-asyncio>=0.21.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
