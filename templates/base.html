<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Galaxy Intelligence Platform{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <div class="container">
        <header class="navbar">
            <a href="/" class="logo">
                <i class="fa-solid fa-galaxy"></i> GALAXY <span>INTELLIGENCE</span>
            </a>
            <div style="font-family: var(--font-heading); font-weight: 500; font-size: 0.95rem; display: flex; gap: 1.5rem;">
                <a href="/"><i class="fa-solid fa-house"></i> Dashboard</a>
            </div>
        </header>

        <main>
            {% block content %}{% endblock %}
        </main>
    </div>
    {% block extra_scripts %}{% endblock %}
</body>
</html>
